name: Weekly yt-dlp Update Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest yt-dlp version from PyPI
        id: pypi
        run: |
          VERSION=$(curl -s https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get yt-dlp version baked into published image
        id: current
        run: |
          docker pull lucatnt/cloudytube:latest
          VERSION=$(docker run --rm lucatnt/cloudytube:latest python -c "import yt_dlp; print(yt_dlp.version.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.pypi.outputs.version }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push updated image
        if: steps.compare.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lucatnt/cloudytube:latest
            lucatnt/cloudytube:${{ steps.pypi.outputs.version }}
